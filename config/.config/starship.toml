format = "$all"
right_format = "$cmd_duration${custom.worktrees}"

command_timeout = 500
scan_timeout = 100

# Set by theme-switcher. Names match theme-switcher/current.
palette = "gruvbox"

[battery]
disabled = true

## start character ##
[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'

[shell]
fish_indicator = ""
unknown_indicator = "?"
style = "bold fg:white"
disabled = true
## end character ##

## start prompt ## 
[directory]
style = "blue"
format = "[⚡︎](blue)[$path]($style)[$read_only]($read_only_style) "
read_only = " "
truncation_symbol = "…󰿟"

[git_branch]
style = "pink"
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style)[ ≡]($style) "

# Latest git tag/release reachable from HEAD (hidden when none)
# tag_max_candidates > 0 finds the nearest ancestral tag, not only exact HEAD tags
[git_commit]
only_detached = false
tag_disabled = false
tag_max_candidates = 10
tag_symbol = "󰓼 "
format = "([$tag]($style) )"
style = "purple"

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
style = "white"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "[ ](fg:red bg:bright-black)"
ahead = "[ ×${count} ](white)"
behind = "[ ×${count} ](white)"
diverged = "[ ×${ahead_count} ×${behind_count} ](bg:bright-black)"
untracked = "️[ ×${count} ](cyan)"
stashed = " "
modified = "[ ×${count} ](yellow)"
staged = "[ ×${count} ](bright-green)"
deleted = "[ ×${count} ](bright-red)"
renamed = "[ ×${count} ](orange)"

[cmd_duration]
disabled = false
min_time = 1
format = "[󰔛 $duration]($style)"
show_milliseconds = true
style = "comment"
## end prompt ##

# Total worktrees for the repo, far right. Hidden when only the main one exists.
[custom.worktrees]
command = "git worktree list --porcelain | grep -c '^worktree '"
when = '[ "$(git worktree list --porcelain 2>/dev/null | grep -c "^worktree ")" -gt 1 ]'
shell = ["bash", "--noprofile", "--norc"]
symbol = "\U000F0645 "
style = "purple"
format = " [$symbol$output]($style)"

## start custom symbols ##
[package]
symbol = "󰏗 "

[aws]
style = "orange"
format = "[$symbol($version )]($style)"
symbol = "  "

[deno]
format = "[$symbol($version )]($style)"
style = "comment"
symbol = "󱍢 "

[nodejs]
format = "[$symbol($version )]($style)"
style = "green"
symbol = "󰎙 "
detect_extensions = []

[bun]
format = "[$symbol($version )]($style)"
style = "foreground"
symbol = " "
detect_extensions = []

[golang]
style = "cyan"
format = "[$symbol($version )]($style)"
symbol = " "

[lua]
style = "cyan"
format = "[$symbol($version )]($style)"
symbol = " "

[php]
style = "purple"
format = "[$symbol($version )]($style)"
symbol = " "

[python]
style = "yellow"
format = "[$symbol($version )]($style)"
symbol = " "

[ruby]
style = "red"
format = "[$symbol($version )]($style)"
symbol = "󰴭 "

[rust]
style = "orange"
format = "[$symbol($version )]($style)"
symbol = " "
## end custom symbols ##

