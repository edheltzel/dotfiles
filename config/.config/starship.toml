# $all still fills the rest of the default order. Prefix modules are listed so
# ${custom.gitbutler} sits where $git_branch would, not at the late $custom slot.
# ${custom.git_ahead_behind} stays next to $git_status (not at the late $custom slot).
format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$nats\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
${custom.gitbutler}\
$git_commit\
$git_state\
$git_metrics\
$git_status\
${custom.git_ahead_behind}\
$all
"""
right_format = "$cmd_duration"

command_timeout = 500
scan_timeout = 100

[battery]
disabled = true

## start character ##
[character]
success_symbol = '[](bold #37F499)'
error_symbol = '[](bold #F16C75)'

[shell]
fish_indicator = ""
unknown_indicator = "?"
style = "bold fg:white"
disabled = true
## end character ##

## start prompt ##
[directory]
format = "[⚡︎](#04D1F9)[$path]($style)[$read_only]($read_only_style) "
read_only = " "
truncation_symbol = "…󰿟"

# Replaced by ${custom.gitbutler} (starship-gitbutler). Leave disabled so $all
# does not also print gitbutler/workspace.
[git_branch]
disabled = true
style = "#F265B5"
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style)[ ≡]($style) "

# Latest git tag/release reachable from HEAD (hidden when none)
# tag_max_candidates > 0 finds the nearest ancestral tag, not only exact HEAD tags
[git_commit]
only_detached = false
tag_disabled = false
tag_max_candidates = 10
tag_symbol = "󰓼 "
format = "([$tag]($style) )"
style = "#A48CF2"

[git_metrics]
disabled = false
added_style = "#37F499"
deleted_style = "#F16C75"
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
style = "white"
format = "([$all_status]($style) )"
conflicted = "[ ](fg:red bg:bright-black)"
untracked = "️[ ×${count} ](#04D1F9)"
stashed = " "
modified = "[ ×${count} ](#F1FC79)"
staged = "[ ×${count} ](bright-green)"
deleted = "[ ×${count} ](bright-red)"
renamed = "[ ×${count} ](#F7C67F)"

[cmd_duration]
disabled = false
min_time = 1
format = "[󰔛 $duration]($style)"
show_milliseconds = true
style = "#7081BE"
## end prompt ##

# https://github.com/1stvamp/starship-gitbutler
# Shows applied GitButler stacks; falls back to the current git branch elsewhere.
[custom.gitbutler]
command = "~/.config/starship/gitbutler-branch.sh"
when = true
shell = ["bash", "--noprofile", "--norc"]
format = "$output "
disabled = false
ignore_timeout = true

# Workspace-vs-upstream counts are noise on gitbutler/workspace. Keep them on
# ordinary git repos (same glyphs as the old git_status ahead/behind/diverged).
[custom.git_ahead_behind]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ ! -d "$(git rev-parse --git-path gitbutler 2>/dev/null)" ]'
command = '''
git rev-list --left-right --count HEAD...@{upstream} 2>/dev/null | awk -F '\t' '{
  if ($1 > 0 && $2 > 0) printf " ×%s ×%s", $1, $2
  else if ($1 > 0) printf " ×%s", $1
  else if ($2 > 0) printf " ×%s", $2
}'
'''
shell = ["bash", "--noprofile", "--norc"]
format = "[$output](white) "
disabled = false

## start custom symbols ##
[package]
symbol = "󰏗 "

[aws]
style = "#F7C67F"
format = "[$symbol($version )]($style)"
symbol = "  "

[deno]
format = "[$symbol($version )]($style)"
style = "#7081BE"
symbol = "󱍢 "

[nodejs]
format = "[$symbol($version )]($style)"
style = "#37F499"
symbol = "󰎙 "
detect_extensions = []

[bun]
format = "[$symbol($version )]($style)"
style = "#EBFAFA"
symbol = " "
detect_extensions = []

[golang]
style = "#04D1F9"
format = "[$symbol($version )]($style)"
symbol = " "

[lua]
style = "#04D1F9"
format = "[$symbol($version )]($style)"
symbol = " "

[php]
style = "#A48CF2"
format = "[$symbol($version )]($style)"
symbol = " "

[python]
style = "#F1FC79"
format = "[$symbol($version )]($style)"
symbol = " "

[ruby]
style = "#F16C75"
format = "[$symbol($version )]($style)"
symbol = "󰴭 "

[rust]
style = "#F7C67F"
format = "[$symbol($version )]($style)"
symbol = " "
## end custom symbols ##
