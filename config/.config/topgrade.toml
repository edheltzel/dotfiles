[include]
paths = ["~/.config/topgrade.d/custom.toml"]

[misc]
pre_sudo = false
disable = [
  "system",
  "vscode",
  "containers",
  "ruby_gems",
  "gem",
  "tlmgr",
  "yarn",
  "shell",
  "cargo",
  "rustup",
  "pipx",
  "pyenv",
  "microsoft_office",
  "antigravity",
  "claude_code",
  "claude_code_plugins",
  "pi",
]
ignore_failures = ["bun_packages"]
assume_yes = true
no_retry = true
cleanup = true
skip_notify = true

[composer]
self_update = true

[brew]
greedy_cask = true
autoremove = true
