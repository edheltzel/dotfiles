# mauve = "#646B80"       # — git branches
# red = "#f16c75"
# peach = "#f7c67f"
# yellow = "#f1fc79"
# green = "#37f499"
# teal = "#66e4fd"
# blue = "#9071f4"

### keybindings ###
[keys]
prefix = "alt+,"
detach = "prefix+shift+x"
goto = "prefix+g"

close_workspace = "prefix+shift+w"

rename_workspace = "prefix+shift+e"
rename_tab = "prefix+e"
rename_pane = "prefix+p"

new_workspace = "prefix+n"
new_tab = "prefix+t"
split_vertical = "prefix+\\"

next_workspace = "alt+i"
previous_workspace = "alt+u"

next_tab = "alt+l"
previous_tab = "alt+h"

switch_tab = "alt+1..9"
cycle_pane_next = "alt+]"
cycle_pane_previous = "alt+["

focus_agent = "prefix+1..9"
next_agent = "alt+j"
previous_agent = "alt+k"

# disabled
close_tab = ""
new_worktree = ""
edit_scrollback = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

# custom
[[keys.command]]
key = "prefix+shift+g"
description = "launch LazyGit"
command = "lazygit"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+b"
description = "launch GitButler"
command = "but tui"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+d"
description = "launch Dash"
command = "gh dash"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+t"
description = "launch Tuicr"
command = "tuicr"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+k"
description = "launch Project Board"
command = "gh board --owner edheltzel"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+f"
description = "launch Superfile"
command = "spf"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+v"
description = "launch Neovim"
command = "nvim"
type = "pane"

[[keys.command]]
key = "prefix+shift+s"
description = "launch scratch Terminal"
command = "exec \"${SHELL:-sh}\""
type = "popup"
width = "90%"
height = "90%"

### plugins ###
# Plannotator
[[keys.command]] # Terminal annotations
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]] # Document review (plannotator-tui)
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"
