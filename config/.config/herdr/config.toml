onboarding = false
session.resume_agents_on_restore = true

[experimental]
allow_nested = true
kitty_graphics = true
pane_history = true

[ui]
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "text", text = "▲ HQ" },
]
tab_bar_right_separator = " · "

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", { token = "workspace", bold = false }]]

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "tab", bold = true, dim = false, fg = "#a48cf2" },
    "pane",
  ],
  [
    "state_text",
    "agent",
  ],
  [
    { token = "workspace", dim = true, bold = false, fg = "#646B80" },
    "machine",
  ],
]

[ui.sound]
enabled = true
path = "sounds/notification.mp3"
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"
[ui.toast]
delivery = "terminal"

[theme]
name = "catppuccin-latte"
auto_switch = false

[theme.custom]
panel_bg = "white"

# eldritch
