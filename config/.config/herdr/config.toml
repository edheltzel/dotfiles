onboarding = false
session.resume_agents_on_restore = true

[experimental]
allow_nested = true
kitty_graphics = true
pane_history = true

[ui]
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true

tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "command", command = "~/.config/herdr/agent-usage/tab_id.py", interval_seconds = 2, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/agent-usage/agent_usage.py", interval_seconds = 300, timeout_seconds = 5 },
  { type = "command", command = "curl -s --max-time 2 'wttr.in/Seoul?format=%c+%t' 2>/dev/null", interval_seconds = 600, timeout_seconds = 3 },
  { type = "command", command = "/Users/ed/.dotfiles/config/.config/herdr/plugins/github/herdr-projects-b1278ffb803c/target/release/herdr-projects --root /Users/ed/.herdr-projects needs-you --line", interval_seconds = 15, timeout_seconds = 5 },
]
tab_bar_right_separator = " ⋮ "

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = false },
  ],
  [
    { token = "$hp" },
  ],
]

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    "machine",
    "workspace",
    "tab",
  ],
  [
    "$icon",
    "agent",
  ],
  [
    { token = "$hp_state", rules = [
      { starts_with = "needs you", fg = "#f38ba8", bold = true },
      { starts_with = "review", fg = "#f9e2af" },
    ] },
  ],
  [
    { token = "$hp_activity", dim = true },
  ],
]

[ui.sound]
enabled = true
path = "sounds/notification.mp3"
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[theme]
name = "dracula"
auto_switch = false

### keybindings ###
[keys]
prefix = "alt+,"
detach = "prefix+shift+x"
goto = "prefix+g"

close_workspace = "prefix+shift+w"

rename_workspace = "prefix+shift+e"
rename_tab = "prefix+e"
rename_pane = "prefix+p"

new_workspace = "prefix+n"
new_tab = "prefix+t"
split_vertical = "prefix+\\"

next_workspace = "alt+i"
previous_workspace = "alt+u"

next_tab = "alt+l"
previous_tab = "alt+h"

switch_tab = "alt+1..9"
cycle_pane_next = "alt+]"
cycle_pane_previous = "alt+["

focus_agent = "prefix+1..9"
next_agent = "alt+j"
previous_agent = "alt+k"

# disabled
close_tab = ""
new_worktree = ""
edit_scrollback = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

# custom

[[keys.command]]
key = "prefix+shift+d"
description = "launch Dash"
command = "gh dash"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+f"
description = "launch Yazi"
command = "yazi"
type = "popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+v"
description = "launch Neovim"
command = "nvim"
type = "pane"

[[keys.command]]
key = "prefix+shift+s"
description = "launch scratch Terminal"
command = "exec \"${SHELL:-sh}\""
type = "popup"
width = "90%"
height = "90%"

### plugins ###
# Command Palette
[[keys.command]]
key = "super+p"                   # ⌘+P on macOS
type = "plugin_action"
command = "vjeantet.palette.open"
description = "Command palette"

# Plannotator
[[keys.command]] # Terminal annotations
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]] # Document review (plannotator-tui)
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "herdr-projects.open-popup"
description = "Projects"
