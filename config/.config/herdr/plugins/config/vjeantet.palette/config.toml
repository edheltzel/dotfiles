[[command]]
id = "lazygit"      # unique among your entries; lowercase, digits, . - _
title = "Lazygit"   # shown as "User: Lazygit"
argv = ["lazygit"]  # one array element per argument - never a shell string
placement = "split" # split (default) | tab | zoomed

[[command]]
id = "but"
title = "GitButler TUI"
argv = ["but", "tui"]
placement = "split"

[[command]]
id = "but"
title = "GitButler GUI"
argv = ["but", "gui"]
placement = "split"

[[command]]
id = "superfile"
title = "Superfile"
argv = ["spf"]
placement = "split"

[[command]]
id = "yazi"
title = "Yazi Files"
argv = ["yazi"]
placement = "split"

[[command]]
