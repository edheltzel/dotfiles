# Eldritch Dusk (official light)
# https://github.com/eldritch-theme/eldritch
# Slots follow upstream eldritch-dusk (alacritty port / SPEC.md); accents
# darkened for Pale Shore: ansi >= 4.5:1, brights >= 3:1. black = ink.
[colors]
ansi = [
  '#1e2029',
  '#df0514',
  '#007f42',
  '#a75c00',
  '#4b65d9',
  '#754ef6',
  '#007992',
  '#353746',
]
background = '#f0f3f4'
brights = [
  '#5b73dc',
  '#fb4c58',
  '#00a153',
  '#d37400',
  '#5b73dc',
  '#8a69f7',
  '#0099b7',
  '#474852',
]
compose_cursor = '#8a69f7'
cursor_bg = '#ffaf4d'
cursor_border = '#ffaf4d'
cursor_fg = '#f0f3f4'
foreground = '#1e2029'
scrollbar_thumb = '#38ff9f'
selection_bg = 'rgba(88.6% 90.2% 91.0% 75%)'
selection_fg = 'rgba(0% 0% 0% 0%)'
split = '#e2e6e8'

[colors.indexed]

[colors.tab_bar]
background = '#e2e6e8'

[colors.tab_bar.active_tab]
bg_color = '#38ff9f'
fg_color = '#1e2029'
intensity = 'Normal'
italic = false
strikethrough = false
underline = 'None'

[colors.tab_bar.inactive_tab]
bg_color = '#e2e6e8'
fg_color = '#5b73dc'
intensity = 'Normal'
italic = false
strikethrough = false
underline = 'None'

[colors.tab_bar.inactive_tab_hover]
bg_color = '#d5d9db'
fg_color = '#1e2029'
intensity = 'Normal'
italic = false
strikethrough = false
underline = 'None'

[colors.tab_bar.new_tab]
bg_color = '#e2e6e8'
fg_color = '#1e2029'
intensity = 'Normal'
italic = false
strikethrough = false
underline = 'None'

[colors.tab_bar.new_tab_hover]
bg_color = '#38ff9f'
fg_color = '#1e2029'
intensity = 'Normal'
strikethrough = false
underline = 'None'

[metadata]
aliases = []
author = 'jacobrreed'
name = 'Eldritch Dusk'
origin_url = 'https://github.com/eldritch-theme/eldritch'
