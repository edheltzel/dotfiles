##############################################
#                                            #
#            Eldritch Dusk Theme             #
#                                            #
##############################################

# Light recolor of eldritch.toml. Text accents are the Dusk palette darkened
# to >= 4.5:1 on #f0f3f4 (official neons are decorative-only per SPEC.md).
# https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# No Eldritch chroma style exists; closest light style.
code_syntax_highlight = "catppuccin-latte"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#1e2029"
full_screen_bg = "#f0f3f4"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#007f42", "#754ef6"]

#-- File Panel
file_panel_fg = "#1e2029"
file_panel_bg = "#f0f3f4"
file_panel_border = "#5b73dc"
file_panel_border_active = "#007f42"
file_panel_top_directory_icon = "#007f42"
file_panel_top_path = "#007992"
file_panel_item_selected_fg = "#a75c00"
file_panel_item_selected_bg = "#e2e6e8"

#-- Footer
footer_fg = "#1e2029"
footer_bg = "#f0f3f4"
footer_border = "#5b73dc"
footer_border_active = "#007f42"

#-- Sidebar
sidebar_fg = "#1e2029"
sidebar_bg = "#f0f3f4"
sidebar_title = "#754ef6"
sidebar_border = "#e2e6e8"
sidebar_border_active = "#007f42"
sidebar_item_selected_fg = "#a75c00"
sidebar_item_selected_bg = "#e2e6e8"
sidebar_divider = "#5b73dc"

#-- Modals
modal_fg = "#1e2029"
modal_bg = "#e2e6e8"
modal_border_active = "#007f42"
modal_cancel_fg = "#f0f3f4"
modal_cancel_bg = "#df0514"
modal_confirm_fg = "#f0f3f4"
modal_confirm_bg = "#007f42"

#-- Help Menu
help_menu_hotkey = "#a75c00"
help_menu_title = "#754ef6"

#-- Special
cursor = "#d5057c"
correct = "#007f42"
error = "#df0514"
hint = "#007992"
cancel = "#5b73dc"
